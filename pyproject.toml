[project]
name = "urgantry-sim"
version = "0.1.0"
description = "MuJoCo sim of two gantry-mounted UR7e arms with Wuji hands, with a Gymnasium env"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "mujoco>=3.9.0",
    "numpy",
]

[project.optional-dependencies]
viz = ["opencv-python"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["urgantry_sim*"]

[tool.setuptools.package-data]
urgantry_sim = ["**/*.xml", "**/*.stl", "**/*.STL", "**/*.obj", "**/*.png", "**/LICENSE", "**/*.md"]
